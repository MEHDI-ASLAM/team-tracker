<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Work Tracker</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1c1917;--mut:#6b655e;--line:#e7e1d8;--acc:#e8590c;--acc2:#fff0e6;--ok:#2b8a3e;--warn:#e67700;--blue:#1971c2}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--card:#1f1c19;--ink:#f3eee8;--mut:#a39b92;--line:#332e29;--acc:#ff8a47;--acc2:#2d1f16;--ok:#69db7c;--warn:#ffc078;--blue:#74c0fc}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--acc)}
nav{display:flex;gap:20px;align-items:center}nav a{color:var(--mut)}nav a:hover{color:var(--ink)}
.btn{background:var(--acc);color:#fff!important;border:0;border-radius:999px;padding:10px 20px;font:600 14px inherit;cursor:pointer;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink)!important;border:1px solid var(--line)}.btn.sm{padding:6px 14px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:0 5vw 60px}
.hero{padding:56px 0 28px}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.05;margin:0 0 12px;letter-spacing:-1.5px}.hero h1 span{color:var(--acc)}
.hero p{color:var(--mut);max-width:560px;margin:0 0 20px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:8px 0 28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:28px;display:block}.stat small{color:var(--mut)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.bar input{max-width:280px}.bar select{width:auto}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--acc2)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;font-size:12px;margin-right:8px}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.s-Planned{color:var(--blue)}.s-In\ Progress{color:var(--warn)}.s-Completed{color:var(--ok)}.s-Blocked{color:#e03131}
.link{color:var(--acc);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:9px;min-width:80px}.prog i{display:block;height:100%;background:var(--acc);border-radius:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 4px}.f{margin-bottom:14px}
.crumb{margin:28px 0 8px;color:var(--mut)}h1.t{font-size:clamp(26px,4vw,40px);margin:0 0 10px;letter-spacing:-1px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);align-items:center;margin-bottom:22px}
.tl{border-left:2px solid var(--line);margin-left:6px}.tl div{padding:0 0 18px 18px;position:relative}
.tl div:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--acc);letter-spacing:.06em}
.empty{padding:36px;text-align:center;color:var(--mut)}
footer{text-align:center;color:var(--mut);padding:28px;border-top:1px solid var(--line);font-size:13px}
#mode{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><a href="#/" class="logo">team<b>track</b></a><nav><a href="#/">Dashboard</a><span id="mode"></span><a href="#/new" class="btn sm">+ Add my task</a></nav></header>
<main id="app"></main>
<footer>Team Work Tracker · every task, one place</footer>
<script>
const STATUSES=["Planned","In Progress","Completed","Blocked"],KINDS=["Data collection","Training","Evaluation","Note","Issue"];
let tasks=[],shared=false;const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const ini=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const hrs=t=>(t.entries||[]).reduce((a,e)=>a+(+e.hours||0),0);
async function load(){
 try{const r=await fetch("/api/tasks");if(!r.ok)throw 0;tasks=await r.json();shared=true}
 catch{shared=false;try{tasks=JSON.parse(localStorage.getItem("tasks")||"[]")}catch{tasks=[]}}
 $("#mode").textContent=shared?"● shared":"● local (this browser)";
}
async function save(t){
 if(shared){await fetch("/api/tasks",{method:"POST",body:JSON.stringify(t)})}
 else{const i=tasks.findIndex(x=>x.id===t.id);i<0?tasks.push(t):tasks[i]=t;try{localStorage.setItem("tasks",JSON.stringify(tasks))}catch{}}
}
async function del(id){
 if(shared)await fetch("/api/tasks?id="+id,{method:"DELETE"});
 tasks=tasks.filter(t=>t.id!==id);if(!shared)localStorage.setItem("tasks",JSON.stringify(tasks));
}
const opts=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");

function dash(){
 const q=($("#q")?.value||"").toLowerCase(),sf=$("#sf")?.value||"";
 const list=tasks.filter(t=>(!sf||t.status===sf)&&(t.title+t.owner+t.team).toLowerCase().includes(q));
 const c=s=>tasks.filter(t=>t.status===s).length;
 const people=new Set(tasks.map(t=>t.owner.trim().toLowerCase())).size;
 return `<section class="hero"><h1>Every task. <span>One clear view.</span></h1><p>See who is working on what, how far it has come, and open any task for full details.</p><a class="btn" href="#/new">Add my task</a></section>
 <div class="stats"><div class="stat"><b>${tasks.length}</b><small>Total tasks</small></div><div class="stat"><b>${people}</b><small>People involved</small></div><div class="stat"><b>${c("In Progress")}</b><small>In progress</small></div><div class="stat"><b>${c("Completed")}</b><small>Completed</small></div><div class="stat"><b>${tasks.reduce((a,t)=>a+hrs(t),0)}h</b><small>Hours logged</small></div></div>
 <div class="bar"><input id="q" placeholder="Search name, task or team" value="${esc(q)}"><select id="sf"><option value="">All status</option>${opts(STATUSES,sf)}</select></div>
 <div class="tbl"><table><thead><tr><th>Person</th><th>Task</th><th>Team</th><th>Status</th><th>Progress</th><th></th></tr></thead><tbody>
 ${list.map(t=>`<tr><td><span class="av">${esc(ini(t.owner))}</span>${esc(t.owner)}</td><td><b>${esc(t.title)}</b></td><td>${esc(t.team)}</td><td><span class="pill s-${esc(t.status)}">${esc(t.status)}</span></td><td><div class="prog"><i style="width:${+t.progress||0}%"></i></div></td><td><a class="link" href="#/task/${t.id}">View details →</a></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No tasks yet. Add the first one.</td></tr>`}
 </tbody></table></div>`;
}
function detail(id){
 const t=tasks.find(x=>x.id===id);if(!t)return`<p class="empty">Task not found. <a class="link" href="#/">Back</a></p>`;
 const es=[...(t.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="crumb"><a href="#/" class="link">← Dashboard</a></div><h1 class="t">${esc(t.title)}</h1>
 <div class="meta"><span><span class="av">${esc(ini(t.owner))}</span>${esc(t.owner)}</span><span>${esc(t.team)}</span><span class="pill s-${esc(t.status)}">${esc(t.status)}</span><span>Priority: ${esc(t.priority)}</span>${t.due?`<span>Due: ${esc(t.due)}</span>`:""}<span>${hrs(t)}h logged</span><a class="btn ghost sm" href="#/edit/${t.id}">Edit</a></div>
 <div class="card"><h3>Overview</h3><p>${esc(t.summary)}</p><div class="prog"><i style="width:${+t.progress||0}%"></i></div><small>${+t.progress||0}% complete</small></div>
 <div class="card"><h3>Specification</h3><p style="white-space:pre-wrap">${esc(t.details)||"No details yet."}</p></div>
 <div class="card"><h3>Work log</h3><div class="tl">${es.map(e=>`<div><span class="tag">${esc(e.kind)}</span> · ${esc(e.date)}${+e.hours?` · ${+e.hours}h`:""}<br>${esc(e.text)} <a href="#" class="link" data-del="${e.id}" style="font-size:12px">remove</a></div>`).join("")||'<p class="empty">No entries yet.</p>'}</div></div>
 <div class="card"><h3>Add update</h3><form id="ef"><div class="grid"><div class="f"><label>Type</label><select name="kind">${opts(KINDS)}</select></div><div class="f"><label>Date</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="f"><label>Hours</label><input type="number" step="0.25" min="0" name="hours" value="0"></div></div><div class="f"><label>What was done / observed</label><textarea name="text" rows="3" required></textarea></div><button class="btn">Add to log</button></form></div>`;
}
function form(id){
 const t=tasks.find(x=>x.id===id)||{title:"",owner:"",team:"",status:"Planned",priority:"Medium",due:"",progress:0,summary:"",details:""};
 return `<div class="crumb"><a href="#/" class="link">← Dashboard</a></div><h1 class="t">${id?"Edit task":"Add my task"}</h1><form id="tf" class="card">
 <div class="grid"><div class="f"><label>Your name</label><input name="owner" required value="${esc(t.owner)}"></div><div class="f"><label>Task title</label><input name="title" required value="${esc(t.title)}" placeholder="e.g. TTS – Idumishmi"></div><div class="f"><label>Team / project</label><input name="team" value="${esc(t.team)}"></div></div>
 <div class="grid"><div class="f"><label>Status</label><select name="status">${opts(STATUSES,t.status)}</select></div><div class="f"><label>Priority</label><select name="priority">${opts(["Low","Medium","High"],t.priority)}</select></div><div class="f"><label>Due date</label><input type="date" name="due" value="${esc(t.due)}"></div><div class="f"><label>Progress (%)</label><input type="number" min="0" max="100" name="progress" value="${+t.progress||0}"></div></div>
 <div class="f"><label>Short summary</label><input name="summary" value="${esc(t.summary)}"></div>
 <div class="f"><label>Full specification (data collected, devices, method, training plan, what you observe…)</label><textarea name="details" rows="7">${esc(t.details)}</textarea></div>
 <button class="btn">Save task</button> ${id?'<button type="button" class="btn ghost" id="del">Delete</button>':""}</form>`;
}
async function route(){
 const [,p,id]=location.hash.slice(1).split("/");
 app.innerHTML=p==="task"?detail(id):p==="new"?form():p==="edit"?form(id):dash();window.scrollTo(0,0);
 const g=n=>new FormData(document.forms[0]).get(n);
 if(p==="new"||p==="edit")$("#tf").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const old=tasks.find(x=>x.id===id)||{id:uid(),entries:[]};const t={...old,...f,progress:Math.min(100,Math.max(0,+f.progress||0))};
  await save(t);if(shared)await load();location.hash="#/task/"+t.id};
 if(p==="edit")$("#del").onclick=async()=>{if(confirm("Delete this task?")){await del(id);location.hash="#/"}};
 if(p==="task"){$("#ef").onsubmit=async e=>{e.preventDefault();const t=tasks.find(x=>x.id===id),f=Object.fromEntries(new FormData(e.target));
   t.entries=[...(t.entries||[]),{id:uid(),...f,hours:+f.hours||0}];await save(t);route()};
  app.querySelectorAll("[data-del]").forEach(a=>a.onclick=async e=>{e.preventDefault();const t=tasks.find(x=>x.id===id);t.entries=t.entries.filter(x=>x.id!==a.dataset.del);await save(t);route()})}
 if(!p||p==="")["#q","#sf"].forEach(s=>$(s).oninput=()=>{const v=$("#q").value,pos=$("#q").selectionStart;app.innerHTML=dash();$("#q").focus();$("#q").setSelectionRange(pos,pos);route.bind=null;rebind()});
}
function rebind(){["#q","#sf"].forEach(s=>$(s)&&($(s).oninput=()=>{const pos=$("#q").selectionStart;app.innerHTML=dash();$("#q").focus();$("#q").setSelectionRange(pos,pos);rebind()}))}
addEventListener("hashchange",route);load().then(route);
</script>
</body>
</html>
